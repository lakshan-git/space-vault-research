<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Vault Research — Content Editor</title>
    <script type="module" crossorigin src="./assets/index-Crobq1yH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DFQ9IDs9.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // When opened directly (not via Vite dev server), the JSX module
      // cannot be processed by the browser. Redirect to the pre-built
      // version in dist/ so the app renders correctly.
      var alreadyInDist = window.location.href.indexOf('/dist/') !== -1;
      if (!alreadyInDist) {
        if (window.location.protocol === 'file:') {
          window.location.replace('dist/index.html');
        } else {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && !root.hasChildNodes()) {
              window.location.replace('dist/index.html');
            }
          }, 500);
        }
      }
    </script>
  </body>
</html>
